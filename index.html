<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRD CORP</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #060709;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
      padding-bottom: 20px;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      width: 100%;
    }

    /* OFFICIAL BRAND CARD */
    .brand-card {
      border: 1px solid rgba(0, 255, 136, 0.2);
      border-radius: 16px;
      padding: 24px;
      background: rgba(255, 255, 255, 0.02);
      max-width: 400px;
      margin-bottom: 40px;
    }

    .brand-card .tag {
      font-size: 11px;
      color: #808080;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .brand-content {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .brand-icon {
      width: 50px;
      height: 50px;
      border: 1px solid rgba(0, 255, 136, 0.4);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00ff88;
    }

    .brand-info h2 {
      color: #00ff88;
      font-size: 28px;
      font-weight: 800;
      margin: 0;
      line-height: 1;
    }

    .brand-info p {
      color: #00ff88;
      font-size: 13px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-top: 6px;
    }

    /* BIG HOVER TEXT SECTION (AT THE VERY BOTTOM) */
    .footer-hero-section {
      width: 100%;
      padding: 80px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      background-color: transparent;
      overflow: hidden;
      margin-top: auto;
    }

    .big-outlined-text {
      font-size: clamp(3.5rem, 14vw, 11rem);
      font-weight: 900;
      letter-spacing: 6px;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.15);
      transition: all 0.5s ease-in-out;
      cursor: pointer;
      user-select: none;
      text-align: center;
    }

    /* HOVER EFFECT: WHITE & CYAN GLOW (MATCHES THEME, NO PINK) */
    .big-outlined-text:hover {
      color: #ffffff;
      -webkit-text-stroke: 1.5px #ffffff;
      text-shadow: 0 0 25px rgba(255, 255, 255, 0.7),
                   0 0 50px rgba(0, 229, 255, 0.4);
      transform: scale(1.02);
    }

    /* FOOTER CREDITS */
    footer {
      text-align: center;
      padding: 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      color: #888888;
      font-size: 14px;
    }

    footer p {
      margin: 4px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- BRAND CARD -->
    <div class="brand-card">
      <div class="tag">OFFICIAL BRAND</div>
      <div class="brand-content">
        <div class="brand-icon">
          <i data-lucide="building-2"></i>
        </div>
        <div class="brand-info">
          <h2>MRD</h2>
          <p>REAL ESTATE ADYALA ROAD</p>
        </div>
      </div>
    </div>
  </div>

  <!-- BIG HOVER TEXT SECTION -->
  <section class="footer-hero-section">
    <h1 class="big-outlined-text">MRD CORP</h1>
  </section>

  <!-- FOOTER -->
  <footer>
    <p>© 2026 MRD CORP. All rights reserved.</p>
    <p>ENGINEERED WITH ❤️ BY M. AHMAD RAZA</p>
  </footer>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
