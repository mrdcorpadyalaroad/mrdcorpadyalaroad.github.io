<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MRD CORP</title>

  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🏠</text></svg>">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: #060709;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow-x: hidden;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 40px 20px;
      width: 100%;
    }

    /* HEADER / NAVBAR */
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      margin-bottom: 40px;
    }

    .logo {
      font-size: 24px;
      font-weight: 800;
      color: #00ff88;
      letter-spacing: 1px;
    }

    /* HERO SECTION */
    .hero {
      text-align: center;
      padding: 60px 20px;
      margin-bottom: 40px;
    }

    .hero h1 {
      font-size: clamp(2.5rem, 5vw, 4.5rem);
      font-weight: 800;
      margin-bottom: 20px;
      line-height: 1.1;
    }

    .hero p {
      color: #888888;
      font-size: 18px;
      max-width: 600px;
      margin: 0 auto 30px auto;
    }

    /* BRAND CARDS GRID */
    .brand-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 24px;
      margin-bottom: 60px;
    }

    .brand-card {
      border: 1px solid rgba(0, 255, 136, 0.2);
      border-radius: 20px;
      padding: 28px;
      background: rgba(0, 255, 136, 0.02);
      box-shadow: 0 0 20px rgba(0, 255, 136, 0.03);
      transition: all 0.3s ease;
    }

    .brand-card:hover {
      border-color: rgba(0, 255, 136, 0.5);
      box-shadow: 0 0 30px rgba(0, 255, 136, 0.1);
      transform: translateY(-4px);
    }

    .brand-card .tag {
      font-size: 11px;
      color: #a0a0a0;
      letter-spacing: 2px;
      font-weight: 700;
      margin-bottom: 18px;
      text-transform: uppercase;
    }

    .brand-content {
      display: flex;
      align-items: center;
      gap: 20px;
    }

    .brand-icon {
      width: 56px;
      height: 56px;
      border: 1.5px solid #00ff88;
      border-radius: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #00ff88;
      background: rgba(0, 255, 136, 0.05);
      box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
      flex-shrink: 0;
    }

    .brand-info h2 {
      color: #00ff88;
      font-size: 30px;
      font-weight: 800;
      margin: 0;
      line-height: 1;
      text-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
    }

    .brand-info p {
      color: #00ff88;
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 1px;
      margin-top: 6px;
      text-transform: uppercase;
    }

    /* BIG HOVER TEXT SECTION AT THE VERY BOTTOM */
    .footer-hero-section {
      width: 100%;
      padding: 100px 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      margin-top: auto;
    }

    .big-outlined-text {
      font-size: clamp(3.5rem, 15vw, 12rem);
      font-weight: 900;
      letter-spacing: 6px;
      color: transparent;
      -webkit-text-stroke: 1.5px rgba(255, 255, 255, 0.15);
      transition: all 0.4s ease-in-out;
      cursor: pointer;
      user-select: none;
      text-align: center;
    }

    .big-outlined-text:hover {
      color: #ffffff;
      -webkit-text-stroke: 1.5px #ffffff;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.8),
                   0 0 60px rgba(0, 229, 255, 0.4);
      transform: scale(1.02);
    }

    /* FOOTER CREDITS */
    footer {
      text-align: center;
      padding: 30px 20px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      color: #888888;
      font-size: 13px;
    }

    footer p {
      margin: 4px 0;
    }
  </style>
</head>
<body>

  <div class="container">
    <!-- HEADER -->
    <header>
      <div class="logo">MRD CORP</div>
    </header>

    <!-- HERO SECTION -->
    <section class="hero">
      <h1>Official Portal</h1>
      <p>Real Estate & Business Solutions</p>
    </section>

    <!-- BRAND CARDS GRID -->
    <div class="brand-grid">
      <!-- UPDATED CARD (REAL ESTATE ADYALA ROAD) -->
      <div class="brand-card">
        <div class="tag">OFFICIAL BRAND</div>
        <div class="brand-content">
          <div class="brand-icon">
            <i data-lucide="building-2" size="28"></i>
          </div>
          <div class="brand-info">
            <h2>MRD</h2>
            <p>REAL ESTATE ADYALA ROAD</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- BIG HOVER TEXT SECTION (ADDED AT THE VERY BOTTOM - LIKE VIDEO) -->
  <section class="footer-hero-section">
    <h1 class="big-outlined-text">MRD CORP</h1>
  </section>

  <!-- FOOTER CREDITS -->
  <footer>
    <p>© 2026 MRD CORP. All rights reserved.</p>
    <p>ENGINEERED WITH ❤️ BY M. AHMAD RAZA</p>
  </footer>

  <script>
    lucide.createIcons();
  </script>
</body>
</html>
